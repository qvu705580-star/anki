<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Anki">
<meta name="theme-color" content="#f2f2f7">
<title>Anki iOS Clone</title>
<style>
  :root {
    --bg-color: #f2f2f7;
    --list-bg: #ffffff;
    --text-main: #000000;
    --text-muted: #8e8e93;
    --ios-blue: #007aff;
    --ios-orange: #ff9500;
    --c-new: #007aff; 
    --c-learn: #ff3b30; 
    --c-due: #34c759;
    --border: rgba(60, 60, 67, 0.29);
    --nav-bg: rgba(242, 242, 247, 0.85);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #000000; --list-bg: #1c1c1e; --text-main: #ffffff; --text-muted: #98989d;
      --ios-blue: #0a84ff; --ios-orange: #ff9f0a; --c-new: #0a84ff; --c-learn: #ff453a; --c-due: #32d74b;
      --border: rgba(84, 84, 88, 0.65); --nav-bg: rgba(0, 0, 0, 0.85);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0;}
  body { background: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; font-size: 17px;}
  .hidden { display: none !important; }
  
  /* TOP NAV */
  .nav-bar {
    position: sticky; top: 0; z-index: 100;
    background: var(--nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display: flex; justify-content: space-between; align-items: center;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    border-bottom: 0.5px solid var(--border);
  }
  .nav-btn { background: none; border: none; color: var(--ios-blue); font-size: 20px; cursor: pointer; padding: 4px; display: flex; align-items: center; }
  .nav-btn.text-btn { font-size: 17px; }
  .nav-title { font-size: 17px; font-weight: 600; text-align: center; flex: 1; }
  .nav-group { display: flex; gap: 14px; align-items: center; width: 85px; }
  .nav-group.right { justify-content: flex-end; }
  .nav-group.left { justify-content: flex-start; }

  main { flex: 1; overflow-y: auto; padding-bottom: calc(env(safe-area-inset-bottom) + 20px); }

  /* GROUPED LISTS */
  .ios-group { background: var(--list-bg); border-radius: 10px; margin: 20px 16px 10px; overflow: hidden; }
  .ios-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 0.5px solid var(--border);
    cursor: pointer; font-size: 17px; min-height: 44px;
  }
  .ios-row:last-child { border-bottom: none; }
  .ios-row:active { background: rgba(0,0,0,0.05); }
  .deck-name { flex: 1; font-weight: 400; }
  .deck-stats { display: flex; align-items: center; gap: 8px; }
  .counts { text-align: right; font-size: 13px; line-height: 1.3; font-weight: 400; display: flex; flex-direction: column;}
  .count-due { color: var(--c-due); }
  .count-new { color: var(--c-new); }
  .chevron { color: #c7c7cc; font-size: 20px; font-weight: 400; padding-left: 2px; }

  /* BOTTOM ACTIONS (Decks) */
  .bottom-actions { display: flex; justify-content: space-between; padding: 10px 20px; font-size: 15px; }
  .btn-add-export { color: var(--ios-blue); cursor: pointer; }
  .btn-sync { color: var(--ios-orange); cursor: pointer; }

  /* ACTION SHEET (Add/Export) */
  .action-sheet-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000;
    display: flex; flex-direction: column; justify-content: flex-end; padding: 10px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .action-sheet-overlay.active { opacity: 1; pointer-events: auto; }
  .action-sheet { transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.8, 0.2, 1); padding-bottom: env(safe-area-inset-bottom);}
  .action-sheet-overlay.active .action-sheet { transform: translateY(0); }
  
  .as-group { background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 14px; margin-bottom: 8px; overflow: hidden; }
  @media (prefers-color-scheme: dark) { .as-group { background: rgba(30,30,30,0.8); } }
  .as-label { padding: 12px; font-size: 13px; color: var(--text-muted); text-align: center; border-bottom: 0.5px solid var(--border); }
  .as-btn {
    width: 100%; padding: 16px; border: none; background: transparent;
    font-size: 20px; color: var(--ios-blue); border-bottom: 0.5px solid var(--border); cursor: pointer;
  }
  .as-btn:active { background: rgba(0,0,0,0.1); }
  .as-btn:last-child { border-bottom: none; }
  .as-cancel { font-weight: 600; }

  /* ADD VIEW */
  .toolbar {
    display: flex; gap: 20px; padding: 12px 16px; background: var(--bg-color);
    overflow-x: auto; border-bottom: 0.5px solid var(--border); white-space: nowrap;
    align-items: center; scrollbar-width: none;
  }
  .toolbar::-webkit-scrollbar { display: none; }
  .toolbar button { background: none; border: none; color: var(--ios-blue); font-size: 18px; cursor: pointer; }
  .toolbar button.bold { font-weight: bold; }
  .toolbar button.italic { font-style: italic; font-family: serif;}
  .toolbar button.underline { text-decoration: underline; }
  
  .add-meta { display: flex; justify-content: space-between; padding: 10px 16px; font-size: 11px; color: var(--ios-blue); text-transform: uppercase;}
  .editor-group { background: var(--list-bg); border-top: 0.5px solid var(--border); border-bottom: 0.5px solid var(--border); }
  .editor-field { position: relative; border-bottom: 0.5px solid var(--border); }
  .editor-field:last-child { border-bottom: none; }
  .editor-field:focus-within { border-bottom: 1.5px solid var(--ios-blue); }
  .editor-label { font-size: 13px; color: var(--text-muted); position: absolute; top: 8px; left: 16px; pointer-events: none;}
  .editor-box { width: 100%; min-height: 60px; padding: 30px 16px 16px; font-size: 17px; outline: none; color: var(--text-main); word-wrap: break-word; }

  /* STUDY VIEW */
  .study-area { padding: 40px 20px 120px; font-size: 22px; text-align: center; word-wrap: break-word; }
  .study-hr { border: none; border-top: 1px solid var(--border); margin: 30px 0; }
  .study-bottom { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-color); z-index: 50; padding-bottom: env(safe-area-inset-bottom);}
  
  .study-counter { display: flex; justify-content: center; gap: 4px; font-size: 15px; font-weight: 400; padding: 12px 0; border-top: 0.5px solid var(--border); position: relative;}
  .study-counter span { padding: 0 2px; }
  .study-gear { position: absolute; right: 16px; top: 10px; color: var(--ios-blue); font-size: 22px; cursor: pointer;}

  .answer-btns { display: flex; gap: 10px; padding: 10px 16px 4px; justify-content: center;}
  .ans-btn { flex: 1; padding: 10px 0; border-radius: 8px; border: none; color: #fff; font-size: 16px; font-weight: 500; display: flex; flex-direction: column; align-items: center; cursor: pointer;}
  .ans-btn span { font-size: 13px; font-weight: 400; opacity: 0.9; margin-bottom: 2px;}
  .ans-again { background: var(--c-learn); } .ans-hard { background: #8e8e93; } .ans-good { background: var(--c-due); } .ans-easy { background: var(--ios-blue); }
  
  .show-ans-btn { width: calc(100% - 32px); margin: 10px auto; padding: 16px; border-radius: 10px; border: none; background: #e5e5ea; color: #000; font-size: 17px; font-weight: 500; display: block; cursor: pointer;}
  @media (prefers-color-scheme: dark) { .show-ans-btn { background: #2c2c2e; color: #fff; } }

  /* DIFF / TYPE IN ANSWER (Red homograph style) */
  .type-input { width: 100%; border: none; border-bottom: 1px solid var(--text-main); background: transparent; color: var(--text-main); font-size: 20px; text-align: center; padding: 10px; margin-bottom: 20px; outline: none; }
  .type-cmp { font-size: 22px; margin-top: 10px; word-break: break-all; }
  .type-cmp .ok { color: var(--c-due); }
  .type-cmp .bad { color: var(--c-learn); background: rgba(255, 59, 48, 0.15); }
  .type-cmp .miss { color: var(--text-muted); text-decoration: line-through; }
  
  /* BROWSE VIEW */
  .search-bar-container { padding: 10px 16px; background: var(--nav-bg); border-bottom: 0.5px solid var(--border); }
  .search-input-wrapper { background: rgba(118, 118, 128, 0.12); border-radius: 10px; display: flex; align-items: center; padding: 6px 8px; }
  .search-input-wrapper span { color: var(--text-muted); font-size: 16px; margin-right: 6px; }
  .search-input-wrapper input { border: none; background: transparent; width: 100%; font-size: 17px; color: var(--text-main); outline: none; }
</style>
</head>
<body>

<div id="view-decks">
  <div class="nav-bar">
    <div class="nav-group left"><button class="nav-btn" style="font-weight:bold">?</button><button class="nav-btn">📊</button></div>
    <div class="nav-title">Decks</div>
    <div class="nav-group right"><button class="nav-btn">🔍</button><button class="nav-btn" onclick="navTo('settings')">⚙️</button></div>
  </div>
  <main>
    <div class="ios-group" id="deckList"></div>
    <div class="bottom-actions">
      <div class="btn-add-export" onclick="document.getElementById('actionSheet').classList.add('active')">Add/Export</div>
      <div class="btn-sync" onclick="alert('Đã đồng bộ dữ liệu nội bộ!')">Synchronize</div>
    </div>
  </main>
</div>

<div class="action-sheet-overlay" id="actionSheet" onclick="if(event.target===this) this.classList.remove('active')">
  <div class="action-sheet">
    <div class="as-group">
      <div class="as-label">Add/Export</div>
      <button class="as-btn" onclick="alert('Tính năng đang phát triển')">Shared Deck List</button>
      <button class="as-btn" onclick="alert('Tính năng đang phát triển')">Download Link</button>
      <button class="as-btn" onclick="alert('Tính năng đang phát triển')">Import from iTunes</button>
      <button class="as-btn" onclick="exportData()">Export Collection</button>
      <button class="as-btn" onclick="createDeck()">Add Empty Deck</button>
    </div>
    <div class="as-group">
      <button class="as-btn as-cancel" onclick="document.getElementById('actionSheet').classList.remove('active')">Cancel</button>
    </div>
  </div>
</div>

<div id="view-add" class="hidden">
  <div class="nav-bar">
    <div class="nav-group left"><button class="nav-btn text-btn" onclick="navTo('decks')">〈 Back</button></div>
    <div class="nav-title">Add</div>
    <div class="nav-group right"><button class="nav-btn text-btn" style="font-weight:600" onclick="addNote()">Done</button></div>
  </div>
  <div class="toolbar">
    <button class="bold" onclick="document.execCommand('bold', false, null)">B</button>
    <button class="italic" onclick="document.execCommand('italic', false, null)">I</button>
    <button class="underline" onclick="document.execCommand('underline', false, null)">U</button>
    <button>F<sub style="font-size:10px">x</sub></button>
    <button>👁</button>
    <button>🎤</button>
    <button onclick="document.getElementById('mediaUpload').click()">📎</button>
    <input type="file" id="mediaUpload" accept="image/*,audio/*" style="display:none" onchange="handleMediaUpload(event)">
    <button>A</button>
    <button>√</button>
    <button>&lt;/&gt;</button>
  </div>
  <div class="add-meta">
    <div id="addTypeLabel">Type: Basic</div>
    <div id="addDeckLabel">Deck: vh</div>
  </div>
  <div class="editor-group">
    <div class="editor-field">
      <div class="editor-label">Front</div>
      <div id="addFront" class="editor-box" contenteditable="true"></div>
    </div>
    <div class="editor-field">
      <div class="editor-label">Back</div>
      <div id="addBack" class="editor-box" contenteditable="true"></div>
    </div>
    <div class="editor-field">
      <div class="editor-label">Tags</div>
      <div id="addTags" class="editor-box" contenteditable="true"></div>
    </div>
  </div>
</div>

<div id="view-study" class="hidden">
  <div class="nav-bar" style="background: var(--bg-color); border-bottom: none;">
    <div class="nav-group left" style="width:auto"><button class="nav-btn text-btn" onclick="navTo('decks')">〈 Decks</button></div>
    <div class="nav-group right" style="width:160px; justify-content: space-between; font-size:15px; color:var(--ios-blue);">
      <span style="cursor:pointer" onclick="navTo('add')">Add</span>
      <span style="cursor:pointer">Edit</span>
      <span style="cursor:pointer" onclick="navTo('browse')">Browse</span>
    </div>
  </div>
  <main style="background: var(--bg-color);">
    <div class="study-area">
      <div id="cardContent"></div>
    </div>
  </main>
  <div class="study-bottom">
    <div id="answerBar"></div>
    <div class="study-counter">
      <span class="count-new" id="sNew">600</span> <span style="color:var(--text-main)">+</span>
      <span class="count-learn" id="sLearn">0</span> <span style="color:var(--text-main)">+</span>
      <span class="count-due" id="sDue">0</span>
      <div class="study-gear">⚙️</div>
    </div>
  </div>
</div>

<div id="view-settings" class="hidden">
  <div class="nav-bar">
    <div class="nav-group left"><button class="nav-btn text-btn" onclick="navTo('decks')">〈 Back</button></div>
    <div class="nav-title">Preferences</div>
    <div class="nav-group right"></div>
  </div>
  <div class="ios-group">
    <div class="ios-row">Syncing <span class="chevron">›</span></div>
    <div class="ios-row">Review <span class="chevron">›</span></div>
    <div class="ios-row">Editing <span class="chevron">›</span></div>
    <div class="ios-row">Theme <span class="chevron">›</span></div>
    <div class="ios-row">Profiles <span class="chevron">›</span></div>
    <div class="ios-row" onclick="exportData()">Backups <span class="chevron">›</span></div>
    <div class="ios-row">About <span class="chevron">›</span></div>
  </div>
  <div class="ios-group">
    <div class="ios-row" style="color: var(--ios-blue);">Check Database</div>
    <div class="ios-row" style="color: var(--ios-blue);">Check Media</div>
    <div class="ios-row" style="color: var(--ios-blue);">Empty Cards</div>
  </div>
</div>

<div id="view-browse" class="hidden">
  <div class="nav-bar">
    <div class="nav-group left"><button class="nav-btn text-btn" onclick="navTo('settings')">⚙️</button><button class="nav-btn">👁</button></div>
    <div class="nav-title">Browse</div>
    <div class="nav-group right"><button class="nav-btn">≡</button><button class="nav-btn" onclick="navTo('study')">✓</button></div>
  </div>
  <div class="search-bar-container">
    <div class="search-input-wrapper">
      <span>🔍</span>
      <input type="text" placeholder="deck:current" id="browseSearch">
    </div>
  </div>
</div>

<script>
/* DB MEDIA */
const DB_NAME = "AnkiMediaDB"; let db;
function initDB() { return new Promise((r) => { const req = indexedDB.open(DB_NAME, 1); req.onupgradeneeded = (e) => { e.target.result.createObjectStore("media"); }; req.onsuccess = (e) => { db = e.target.result; r(); }; }); }
function saveMedia(id, blob) { return new Promise((r) => { const tx = db.transaction("media", "readwrite"); tx.objectStore("media").put(blob, id); tx.oncomplete = r; }); }
function getMedia(id) { return new Promise((r) => { const tx = db.transaction("media", "readonly"); const req = tx.objectStore("media").get(id); req.onsuccess = () => r(req.result); req.onerror = () => r(null); }); }

async function handleMediaUpload(e) {
  const f = e.target.files[0]; if(!f) return;
  const id = "m_" + Date.now(); await saveMedia(id, f);
  const url = URL.createObjectURL(f);
  let html = f.type.startsWith("image/") ? `<br><img src="${url}" data-media-id="${id}" style="max-width:150px; border-radius:10px;"><br>` : `<audio controls src="${url}" data-media-id="${id}"></audio>`;
  document.execCommand('insertHTML', false, html); e.target.value = ""; 
}
async function renderHTML(htmlString) {
  if(!htmlString) return "";
  const div = document.createElement('div'); div.innerHTML = htmlString;
  for (let el of div.querySelectorAll('[data-media-id]')) {
    const blob = await getMedia(el.getAttribute('data-media-id'));
    if(blob) el.src = URL.createObjectURL(blob);
  }
  return div.innerHTML;
}

/* APP LOGIC & SM-2 */
const DAY = 86400000, MIN = 60000;
let state = null, currentDeck = null, currentCard = null, isAns = false;

function uid() { return Date.now().toString(36) + Math.random().toString(36).substring(2,5); }
function today() { return Math.floor((Date.now() - 4*3600000)/DAY); }

function loadData() {
  const raw = localStorage.getItem("anki_ios_clone");
  if (raw) return JSON.parse(raw);
  const d1 = uid(), d2 = uid(), d3 = uid();
  const s = { decks: [{id: d1, name: "- Chinese"}, {id: d2, name: "- 1. Vocab"}, {id: d3, name: "vh"}], notes: [], cards: [] };
  
  const addCard = (dk, type, f, b) => {
    const n = {id: uid(), deckId: dk, type: type, front: f, back: b};
    s.notes.push(n);
    s.cards.push({id: uid(), noteId: n.id, deckId: dk, state: "new", due: 0, ivl: 0, ease: 2500, reps: 0});
  };
  
  // Seed data matching screenshot
  addCard(d3, "typein", "get; obtain; win; earn<br>verb", "He received a gift.<br><span style='color: #ff3b30;'>homograph</span>");
  for(let i=0;i<168;i++) addCard(d1, "basic", "Test Due " + i, "Ans"); 
  for(let i=0;i<4789;i++) addCard(d1, "basic", "Test New " + i, "Ans");
  
  return s;
}
function saveData() { localStorage.setItem("anki_ios_clone", JSON.stringify(state)); }

/* NAVIGATION */
function navTo(viewId) {
  ['decks', 'add', 'study', 'settings', 'browse'].forEach(v => document.getElementById('view-' + v).classList.add('hidden'));
  document.getElementById('view-' + viewId).classList.remove('hidden');
  if(viewId === 'decks') renderDecks();
  if(viewId === 'add') {
      const dk = state.decks.find(d => d.id === currentDeck) || state.decks[0];
      document.getElementById('addDeckLabel').innerText = "Deck: " + (dk ? dk.name : "Default");
  }
}

/* RENDER DECKS */
function renderDecks() {
  const list = document.getElementById('deckList');
  list.innerHTML = "";
  const td = today(), now = Date.now();
  
  state.decks.forEach(dk => {
    let n=0, l=0, d=0;
    state.cards.filter(c => c.deckId === dk.id).forEach(c => {
      if(c.state === "new") n++;
      else if(c.state === "learning") l++; 
      else if(c.state === "review" && c.due <= td) d++;
    });
    
    // Screenshot: Green (due) on top, Blue (new) on bottom.
    let countsHtml = `<div class="counts">
      <div class="count-due">${d>0?d:0}</div>
      <div class="count-new">${n>0?n:0}</div>
    </div>`;

    list.innerHTML += `
      <div class="ios-row" onclick="startStudy('${dk.id}')">
        <div class="deck-name">${dk.name}</div>
        <div class="deck-stats">${countsHtml} <span class="chevron">›</span></div>
      </div>
    `;
  });
}

function createDeck() {
  document.getElementById('actionSheet').classList.remove('active');
  const name = prompt("Enter new deck name:");
  if(name) { state.decks.push({id: uid(), name: name.trim()}); saveData(); renderDecks(); }
}

function addNote() {
  const dk = currentDeck || state.decks[0].id;
  const f = document.getElementById('addFront').innerHTML;
  const b = document.getElementById('addBack').innerHTML;
  if(!f || f==="<br>") return alert("Front field is empty!");

  const n = {id: uid(), deckId: dk, type: "basic", front: f, back: b};
  state.notes.push(n);
  state.cards.push({id: uid(), noteId: n.id, deckId: dk, state: "new", due: 0, ivl: 0, ease: 2500, reps: 0});
  
  saveData();
  document.getElementById('addFront').innerHTML = "";
  document.getElementById('addBack').innerHTML = "";
  navTo('decks');
}

/* STUDY CORE */
function startStudy(dkId) {
  currentDeck = dkId; navTo('study'); loadNextCard();
}

async function loadNextCard() {
  const td = today(), now = Date.now();
  const cards = state.cards.filter(c => c.deckId === currentDeck);
  let n=0, l=0, d=0;
  cards.forEach(c => {
    if(c.state === "new") n++; else if(c.state === "learning") l++; else if(c.state === "review" && c.due <= td) d++;
  });
  
  document.getElementById('sNew').innerText = n;
  document.getElementById('sLearn').innerText = l;
  document.getElementById('sDue').innerText = d;
  
  let next = cards.find(c => c.state === "learning" && c.due <= now) || cards.find(c => c.state === "review" && c.due <= td) || cards.find(c => c.state === "new");

  const content = document.getElementById('cardContent');
  const bar = document.getElementById('answerBar');
  
  if(!next) {
    content.innerHTML = `<br><br><span style="color:var(--text-muted)">Congratulations! You have finished this deck for now.</span>`;
    bar.innerHTML = ""; currentCard = null; return;
  }
  
  currentCard = next; isAns = false;
  const note = state.notes.find(nt => nt.id === next.noteId);
  
  let typeBox = "";
  if(note.type === "typein") {
    typeBox = `<br><input type="text" class="type-input" id="typeInput" placeholder="Type in the answer" autocomplete="off">`;
  }
  
  content.innerHTML = `<div style="font-size:20px">${await renderHTML(note.front)}</div>` + typeBox;
  bar.innerHTML = `<button class="show-ans-btn" onclick="showAnswer()">Show Answer</button>`;
  
  if(note.type === "typein") {
    setTimeout(() => document.getElementById('typeInput').focus(), 100);
  }
}

// LCS algorithm for Type in answer diff
function diffTyped(typed, expected){
  const a=[...(typed||"")].slice(0,200), b=[...(expected||"")].slice(0,200);
  const n=a.length, m=b.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const typedSeg=[], expSeg=[];
  let i=0,j=0;
  while(i<n&&j<m){
    if(a[i]===b[j]){ typedSeg.push(["ok",a[i]]); expSeg.push(["ok",b[j]]); i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]){ typedSeg.push(["bad",a[i]]); i++; }
    else{ expSeg.push(["miss",b[j]]); typedSeg.push(["miss","‑"]); j++; }
  }
  while(i<n){ typedSeg.push(["bad",a[i++]]); } while(j<m){ expSeg.push(["miss",b[j]]); typedSeg.push(["miss","‑"]); }
  const seg2html=seg=>seg.map(([cl,ch])=>`<span class="${cl}">${ch}</span>`).join("");
  return { typedHtml:seg2html(typedSeg), expectedHtml: expected }; // Simplified expected
}

async function showAnswer() {
  isAns = true;
  const nt = state.notes.find(n => n.id === currentCard.noteId);
  
  let diffHtml = "";
  if(nt.type === "typein") {
      const typed = document.getElementById('typeInput').value || "";
      // Strip html from expected back for pure diff
      const expectedText = nt.back.replace(/<[^>]*>?/gm, ''); 
      const diff = diffTyped(typed, expectedText);
      diffHtml = `<div class="type-cmp">${diff.typedHtml}</div><br>`;
      document.getElementById('typeInput').style.display = 'none';
  }
  
  document.getElementById('cardContent').innerHTML += diffHtml + `<hr class="study-hr">` + `<div style="font-size:20px">${await renderHTML(nt.back)}</div>`;
  
  document.getElementById('answerBar').innerHTML = `
    <div class="answer-btns">
      <button class="ans-btn ans-again" onclick="ans(1)"><span><1m</span>Again</button>
      <button class="ans-btn ans-hard" onclick="ans(2)"><span>6m</span>Hard</button>
      <button class="ans-btn ans-good" onclick="ans(3)"><span>10m</span>Good</button>
      <button class="ans-btn ans-easy" onclick="ans(4)"><span>4d</span>Easy</button>
    </div>
  `;
}

function ans(grade) {
  const c = currentCard; const td = today(), now = Date.now();
  if (c.state === 'new' || c.state === 'learning') {
    if (grade === 1) { c.due = now + MIN; c.state = 'learning'; }
    else if (grade === 4) { c.state = 'review'; c.ivl = 4; c.due = td + 4; }
    else { c.state = 'review'; c.ivl = 1; c.due = td + 1; }
  } else {
    if (grade === 1) { c.state = 'learning'; c.due = now + MIN; c.ivl = 1; }
    else if (grade === 4) { c.ivl = Math.round(c.ivl * 1.3 * 1.3); c.due = td + c.ivl; }
    else { c.ivl = Math.round(c.ivl * 1.2); c.due = td + c.ivl; }
  }
  saveData(); loadNextCard();
}

/* EXPORT */
function exportData() {
  document.getElementById('actionSheet').classList.remove('active');
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state)], {type: "application/json"}));
  a.download = "anki-collection.json"; a.click();
}

/* INIT */
(async () => { await initDB(); state = loadData(); renderDecks(); })();
